    <g stroke="#1A1409" stroke-width="1.5"><line y1="-51" y2="-42"/><line x1="51" x2="42"/><line y1="51" y2="42"/><line x1="-51" x2="-42"/></g></g>
  <circle r="26" fill="url(#brass)"/><circle r="19" fill="none" stroke="#1A1409" stroke-opacity=".35"/>
  <polygon points="0,-68 -5,-59 5,-59" fill="#C9A24B"/></g>
